<!DOCTYPE html>
<html lang="id">
<head>

<title>Tchis Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

color:white;
}

header{
background:linear-gradient(90deg,#0066ff,#00bfff);

text-align:center;
}

padding:30px 20px;
}

.card{

padding:20px;

}

.card:hover{
transform:translateY(-5px);
}

h2{
color:#3ea6ff;
margin-bottom:15px;
}

ul{
padding-left:20px;
line-height:2;
}

.button{

margin-top:20px;
padding:14px 30px;
background:#25D366;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

footer{
text-align:center;
padding:30px;
background:#111;
margin-top:50px;
color:#aaa;
}
</style>

</head>
<body>

<header>

<center>
<a class="button" href="https://wa.me/62XXXXXXXXXX">

</a>
</center>

</div>

<footer>

</html>
